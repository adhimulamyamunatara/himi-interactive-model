name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # The Render address is public. A repository variable can override it.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://himi-interactive-model.onrender.com' }}
        run: npm run build

      # GitHub Pages has no URL rewriting: a refresh on /dashboard would be a 404.
      # Serving the app itself as the 404 page lets the router take over.
      - name: Single-page-app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
